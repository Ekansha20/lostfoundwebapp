<!DOCTYPE html>
<html>
<head>
  <title>Report Lost Item</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header">
  <h1>FINDIT</h1>
  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="lost.html" class="active">Report Lost Item</a>
    <a href="found.html">Report Found Item</a>
    <a href="items.html">Browse Items</a>
    <a href="contact.html">Contact Us</a>

  </nav>
</header>


<form id="lostForm">

<label>Your Name</label>
<input id="personName" required>

<label>Identity Type</label>
<select id="userType" required>
<option>Student</option>
<option>Professor</option>
<option>Guard</option>
<option>Other Staff</option>
</select>

<label>Item Name</label>
<input id="itemName" required>

<label>Date Lost</label>
<input id="date" type="date" required>

<label>Location</label>
<input id="lostLocation" required>

<label>Description</label>
<textarea id="description"></textarea>

<label>Email</label>
<input id="email" type="email" required>

<label>Phone</label>
<input id="phone" required>

<label>Upload Image</label>
<input type="file" id="imageUpload" accept="image/*">

<button type="submit">Submit Lost Item</button>

</form>

<script type="module">
import { initializeApp } from 
"https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

import { 
  getFirestore, collection, addDoc 
} from 
"https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyCosGGqYQR8_q3lGGtUkSaIKIB4nKb6I9k",
 authDomain: "lost-found-webapp-a15c7.firebaseapp.com",
 projectId: "lost-found-webapp-a15c7",
 storageBucket: "lost-found-webapp-a15c7.appspot.com",
 messagingSenderId: "469222534302",
 appId: "1:469222534302:web:fc8cddaa0b0e5143459f8f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById("lostForm")
.addEventListener("submit", async (e) => {

 e.preventDefault();

 await addDoc(collection(db, "lostItems"), {
   personName: personName.value,
   userType: userType.value,
   itemName: itemName.value.trim(),
   lostDate: date.value,
   location: lostLocation.value.trim(),
   description: description.value,
   email: email.value,
   phone: phone.value,
   imageURL: "",   // placeholder
   timestamp: new Date()
 });

 alert("Lost item submitted successfully!");
 lostForm.reset();
});
</script>


</body>
</html>
