<!DOCTYPE html>
<html>
<head>
  <title>Report Found Item</title>
  <link rel="stylesheet" href="style.css">

  <!-- EMAILJS LIBRARY -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>
<body>

<header>
<h1>Report Found Item</h1>
<nav>
 <a href="index.html">Home</a> |
 <a href="lost.html">Report Lost</a> |
 <a href="found.html">Report Found</a> |
 <a href="items.html">View Items</a>
</nav>
</header>

<form id="foundForm">

<label>Your Name</label>
<input id="personName" required>

<label>Identity Type</label>
<select id="userType" required>
<option>Student</option>
<option>Professor</option>
<option>Guard</option>
<option>Other Staff</option>
</select>

<label>Item Name</label>
<input id="itemName" required>

<label>Date Found</label>
<input id="date" type="date" required>

<label>Location</label>
<input id="foundLocation" required>

<label>Description</label>
<textarea id="description"></textarea>

<label>Email</label>
<input id="email" type="email" required>

<label>Phone</label>
<input id="phone" required>

<label>Upload Image</label>
<input type="file" id="imageUpload" accept="image/*">

<button type="submit">Submit Found Item</button>

</form>

<script type="module">

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

import { 
  getFirestore, addDoc, collection, getDocs 
} from 
"https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

import {
  getStorage, ref, uploadBytes, getDownloadURL
} from
"https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
 apiKey: "AIzaSyCosGGqYQR8_q3lGGtUkSaIKIB4nKb6I9k",
 authDomain: "lost-found-webapp-a15c7.firebaseapp.com",
 projectId: "lost-found-webapp-a15c7",
 storageBucket: "lost-found-webapp-a15c7.appspot.com",
 messagingSenderId: "469222534302",
 appId: "1:469222534302:web:fc8cddaa0b0e5143459f8f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

/* EMAILJS INIT */
emailjs.init("rW6rp5HvtOEVxeari");

document.getElementById("foundForm")
.addEventListener("submit", async (e) => {

 e.preventDefault();

 let imageURL = "";

 const file = imageUpload.files[0];
 if (file) {
   const storageRef = ref(storage, "foundImages/" + file.name);
   await uploadBytes(storageRef, file);
   imageURL = await getDownloadURL(storageRef);
 }

 /* SAVE FOUND ITEM */
 const foundDoc = await addDoc(collection(db, "foundItems"), {
   personName: personName.value,
   userType: userType.value,
   itemName: itemName.value.trim(),
   foundDate: date.value,
   location: foundLocation.value.trim(),
   description: description.value,
   email: email.value,
   phone: phone.value,
   imageURL: imageURL,
   timestamp: new Date()
 });

 /* MATCH LOST ITEMS */
 const lostSnap = await getDocs(collection(db, "lostItems"));

 lostSnap.forEach(doc => {
   const lost = doc.data();

   if (
     lost.itemName.trim().toLowerCase() === itemName.value.trim().toLowerCase() &&
     lost.location.trim().toLowerCase() === foundLocation.value.trim().toLowerCase()
   ) {

     const confirmURL =
     `https://Ekansha20.github.io/lostfoundwebapp/confirm.html?lost=${doc.id}&found=${foundDoc.id}`;

     emailjs.send("service_id", "template_id", {
       to_email: lost.email,
       lost_item: lost.itemName,
       lost_location: lost.location,
       found_person: personName.value,
       found_type: userType.value,
       confirm_link: confirmURL
     });
   }
 });

 alert("Found item submitted successfully!");
 foundForm.reset();
});
</script>

</body>
</html>
