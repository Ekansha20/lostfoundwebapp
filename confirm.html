<!DOCTYPE html>
<html>
<head>
  <title>Confirmation Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      text-align: center;
    }
  </style>
</head>
<body>

<h1 id="statusText">Processing confirmation...</h1>

<script type="module">

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

import { 
  getFirestore, doc, getDoc, deleteDoc, collection, addDoc 
} from 
"https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCosGGqYQR8_q3lGGtUkSaIKIB4nKb6I9k",
  authDomain: "lost-found-webapp-a15c7.firebaseapp.com",
  projectId: "lost-found-webapp-a15c7",
  storageBucket: "lost-found-webapp-a15c7.appspot.com",
  messagingSenderId: "469222534302",
  appId: "1:469222534302:web:fc8cddaa0b0e5143459f8f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function processConfirmation() {

  const params = new URLSearchParams(window.location.search);
  const lostId = params.get("lost");
  const foundId = params.get("found");

  if (!lostId || !foundId) {
    document.getElementById("statusText").innerText =
      "Invalid or expired confirmation link.";
    return;
  }

  const lostRef = doc(db, "lostItems", lostId);
  const foundRef = doc(db, "foundItems", foundId);

  const lostSnap = await getDoc(lostRef);
  const foundSnap = await getDoc(foundRef);

  if (!lostSnap.exists() || !foundSnap.exists()) {
    document.getElementById("statusText").innerText =
      "This item has already been confirmed.";
    return;
  }

  const lostData = lostSnap.data();
  const foundData = foundSnap.data();

  // Move to history
  await addDoc(collection(db, "historyItems"), {
    lost: lostData,
    found: foundData,
    resolvedAt: new Date()
  });

  // Delete from active lists
  await deleteDoc(lostRef);
  await deleteDoc(foundRef);

  document.getElementById("statusText").innerText =
    "✅ Your confirmation has been recorded successfully. The item has been resolved.";
}

processConfirmation();

</script>

</body>
</html>
