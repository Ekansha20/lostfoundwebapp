<!DOCTYPE html>
<html>
<head>
  <title>FINDIT | Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header">
  <div class="header-inner">

    <div class="brand">
      <span class="brand-icon">🧭</span>
      <span class="brand-text">FINDIT</span>
    </div>

    <nav class="main-nav">
      <a href="index.html" >Home</a>
      <a href="lost.html">Report Lost Item</a>
      <a href="found.html">Report Found Item</a>
      <a href="items.html">Browse Items</a>
      <a href="contact.html" class="active">Contact Us</a>
    </nav>

  </div>
</header>

<div class="contact-wrapper">

  <h2 class="contact-title">Get in touch</h2>

  <p class="contact-subtext">
    Have feedback, suggestions, or questions about FINDIT?  
    We’d love to hear from you.
  </p>

  <form class="contact-form">
    
    <label>Your Name</label>
    <input type="text" placeholder="Enter your name" required>

    <label>Email</label>
    <input type="email" placeholder="Enter your email" required>

    <label>Message</label>
    <textarea placeholder="Write your message here..." required></textarea>

    <button type="submit" disabled>
      Submit (Coming Soon)
    </button>

  </form>

  <p class="contact-note">
    This feature is currently under development.  
    Backend integration will be added in a future phase.
  </p>

</div>

</body>
</html>
